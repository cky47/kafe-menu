<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Melitta Coffee - Yönetim</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(45, 28, 18, 0.88),
                    rgba(45, 28, 18, 0.88)
                ),
                url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1800&q=85");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            color: white;

        }


        .container {

            width: 90%;

            max-width: 650px;

            margin: auto;

            padding: 35px 0 50px;

        }


        /* BAŞLIK */

        .header {

            text-align: center;

            margin-bottom: 35px;

        }


        .header h1 {

            font-family: Georgia, serif;

            font-size: 36px;

            color: #f4e4c8;

            margin-bottom: 8px;

        }


        .header p {

            color: #eadbc5;

            font-size: 15px;

        }


        /* PANEL */

        .panel {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        /* MENÜ BUTONU */

        .admin-button {

            width: 100%;

            padding: 22px;

            display: flex;

            align-items: center;

            gap: 18px;

            border-radius: 18px;

            background: rgba(255,248,238,0.96);

            color: #4b3022;

            text-decoration: none;

            box-shadow:
                0 8px 24px rgba(0,0,0,0.25);

            transition: 0.2s;

        }


        .admin-button:hover {

            transform: translateY(-3px);

            background: white;

        }


        /* İKON */

        .icon {

            width: 58px;

            height: 58px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #70513d;

            border-radius: 16px;

            font-size: 29px;

        }


        /* YAZI */

        .button-text {

            flex: 1;

        }


        .button-text h2 {

            font-family: Georgia, serif;

            font-size: 20px;

            margin-bottom: 5px;

        }


        .button-text p {

            font-size: 13px;

            color: #76594a;

        }


        .arrow {

            font-size: 23px;

            color: #70513d;

        }


        /* ALT */

        .footer {

            text-align: center;

            margin-top: 30px;

        }


        .footer a {

            color: #eadbc5;

            text-decoration: none;

            font-size: 14px;

        }


        /* MOBİL */

        @media (max-width: 500px) {

            .container {

                width: 92%;

                padding-top: 25px;

            }


            .header h1 {

                font-size: 31px;

            }


            .admin-button {

                padding: 18px;

                gap: 14px;

            }


            .icon {

                width: 50px;

                height: 50px;

                font-size: 25px;

            }


            .button-text h2 {

                font-size: 17px;

            }


            .button-text p {

                font-size: 11px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- BAŞLIK -->

    <div class="header">

        <h1>
            Melitta Coffee
        </h1>

        <p>
            Yönetim Paneli
        </p>

    </div>


    <!-- YÖNETİM PANELİ -->

    <div class="panel">


        <!-- MENÜ YÖNETİMİ -->

        <a
            href="menu-yonetim.html"
            class="admin-button">

            <div class="icon">
                📋
            </div>

            <div class="button-text">

                <h2>
                    Menü Yönetimi
                </h2>

                <p>
                    Kategori ve ürünleri düzenle
                </p>

            </div>

            <div class="arrow">
                ›
            </div>

        </a>


    </div>


    <!-- SİTEYE DÖN -->

    <div class="footer">

        <a href="index.html">

            ← Siteye dön

        </a>

    </div>


</div>


</body>

</html>
