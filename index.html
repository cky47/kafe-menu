<!DOCTYPE html>

<html lang="tr">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Melitta Coffee</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {

        min-height: 100vh;

        font-family: Arial, sans-serif;

        background-image:
            linear-gradient(
                rgba(45, 28, 18, 0.48),
                rgba(45, 28, 18, 0.48)
            ),
            url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1800&q=85");

        background-size: cover;

        background-position: center;

        background-attachment: fixed;

        color: white;
    }

    .container {

        width: 92%;

        max-width: 620px;

        margin: 0 auto;

        padding-top: 65px;

        padding-bottom: 50px;

        text-align: center;
    }

    .cafe-name {

        font-family: Georgia, serif;

        font-size: 44px;

        font-weight: bold;

        letter-spacing: 2px;

        color: #f4e4c8;

        text-shadow:
            0 3px 8px rgba(0, 0, 0, 0.6);

        margin-bottom: 18px;
    }

    .welcome {

        font-size: 30px;

        font-weight: bold;

        color: #fff8ed;

        text-shadow:
            0 3px 8px rgba(0, 0, 0, 0.6);

        margin-bottom: 12px;
    }

    .description {

        font-size: 18px;

        color: #f7ead8;

        line-height: 1.5;

        text-shadow:
            0 2px 6px rgba(0, 0, 0, 0.6);

        margin-bottom: 42px;
    }

    .buttons {

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 20px;
    }

    .menu-button {

        aspect-ratio: 1 / 1;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 18px;

        text-decoration: none;

        color: #4b3022;

        background: rgba(255, 248, 238, 0.94);

        border-radius: 25px;

        box-shadow:
            0 10px 30px rgba(0, 0, 0, 0.25);

        transition: 0.25s;
    }

    .menu-button:hover {

        transform: translateY(-6px);

        background: white;

        box-shadow:
            0 15px 35px rgba(0, 0, 0, 0.35);
    }

    .icon {

        width: 70px;

        height: 70px;

        display: flex;

        align-items: center;

        justify-content: center;

        background: #70513d;

        border-radius: 20px;
    }

    .icon svg {

        width: 38px;

        height: 38px;

        fill: none;

        stroke: white;

        stroke-width: 1.7;

        stroke-linecap: round;

        stroke-linejoin: round;
    }

    .menu-button span {

        font-size: 17px;

        font-weight: bold;

        letter-spacing: 1px;
    }

    .instagram .icon {

        background:
            linear-gradient(
                135deg,
                #833ab4,
                #fd1d1d,
                #fcb045
            );
    }

    @media (max-width: 500px) {

        .container {

            padding-top: 45px;
        }

        .cafe-name {

            font-size: 34px;
        }

        .welcome {

            font-size: 27px;
        }

        .description {

            font-size: 16px;

            margin-bottom: 30px;
        }

        .buttons {

            gap: 14px;
        }

        .menu-button {

            border-radius: 20px;

            gap: 12px;
        }

        .icon {

            width: 55px;

            height: 55px;

            border-radius: 16px;
        }

        .icon svg {

            width: 29px;

            height: 29px;
        }

        .menu-button span {

            font-size: 13px;
        }

    }

</style>
```

</head>

<body>

<div class="container">

```
<div class="cafe-name">

    Melitta Coffee

</div>

<div class="welcome">

    Hoş Geldiniz

</div>

<div class="description">

    Lezzetlerimizi keşfetmek için<br>
    bir seçim yapın.

</div>

<div class="buttons">

    <!-- MENÜ -->

    <a
        href="menu.html"
        class="menu-button">

        <div class="icon">

            <svg viewBox="0 0 24 24">

                <path d="M7 3v8"></path>

                <path d="M4 3v5a3 3 0 0 0 6 0V3"></path>

                <path d="M7 11v10"></path>

                <path d="M17 3v18"></path>

                <path d="M14 3v7a3 3 0 0 0 6 0V3"></path>

            </svg>

        </div>

        <span>MENÜ</span>

    </a>


    <!-- INSTAGRAM -->

    <a
        href="https://www.instagram.com/coffeemelitta/"
        target="_blank"
        rel="noopener noreferrer"
        class="menu-button instagram">

        <div class="icon">

            <svg viewBox="0 0 24 24">

                <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="5">
                </rect>

                <circle
                    cx="12"
                    cy="12"
                    r="4">
                </circle>

                <circle
                    cx="17.5"
                    cy="6.5"
                    r="1">
                </circle>

            </svg>

        </div>

        <span>INSTAGRAM</span>

    </a>

</div>
```

</div>

</body>

</html>
