<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Melitta Coffee</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            rgba(45,28,18,.58),
            rgba(45,28,18,.58)
        ),
        url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1800&q=85");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color: white;
}

.container {

    width: 100%;
    max-width: 700px;

    margin: 0 auto;

    padding: 90px 20px 50px;

    text-align: center;
}

.logo {

    font-size: 65px;
    margin-bottom: 10px;

}

h1 {

    font-family: Georgia, serif;

    font-size: 46px;

    color: #f4e4c8;

    text-shadow:
        0 3px 8px rgba(0,0,0,.6);

    margin-bottom: 10px;

}

.subtitle {

    color: #fff3df;

    font-size: 18px;

    margin-bottom: 35px;

}


/* BUTONLAR */

.buttons {

    width: 100%;

    display: flex;

    flex-direction: row;

    flex-wrap: nowrap;

    justify-content: center;

    align-items: center;

    gap: 20px;

}

.button {

    width: 190px !important;

    min-width: 190px !important;

    max-width: 190px !important;

    height: 190px !important;

    min-height: 190px !important;

    max-height: 190px !important;

    flex: 0 0 190px !important;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 14px;

    padding: 0 !important;

    margin: 0 !important;

    border-radius: 22px;

    text-decoration: none;

    font-weight: bold;

    font-size: 18px;

    background: rgba(255,248,238,.96);

    color: #4b3022;

    box-shadow:
        0 9px 26px rgba(0,0,0,.25);

    transition: transform .25s;

}

.button:hover {

    transform: translateY(-5px);

}

.button-icon {

    width: 65px;

    height: 65px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #70513d;

    border-radius: 17px;

    font-size: 34px;

}

.instagram {

    background: #70513d;

    color: white;

}

.instagram .button-icon {

    background: rgba(255,255,255,.18);

}


/* TELEFON */

@media (max-width: 500px) {

    .container {

        padding-top: 60px;

        padding-left: 12px;

        padding-right: 12px;

    }

    h1 {

        font-size: 36px;

    }

    .subtitle {

        font-size: 16px;

        margin-bottom: 30px;

    }

    .buttons {

        gap: 12px;

    }

    .button {

        width: 165px !important;

        min-width: 165px !important;

        max-width: 165px !important;

        height: 165px !important;

        min-height: 165px !important;

        max-height: 165px !important;

        flex: 0 0 165px !important;

        border-radius: 19px;

        font-size: 16px;

    }

    .button-icon {

        width: 55px;

        height: 55px;

        border-radius: 14px;

        font-size: 29px;

    }

}

</style>

</head>

<body>

<div class="container">

```
<div class="logo">☕</div>

<h1>Melitta Coffee</h1>

<div class="subtitle">
    Kahvenin en güzel hali
</div>

<div class="buttons">

    <a href="menu.html" class="button">

        <div class="button-icon">
            ☕
        </div>

        <span>
            Menümüz
        </span>

    </a>

    <a
        href="https://www.instagram.com/coffeemelitta/"
        target="_blank"
        rel="noopener noreferrer"
        class="button instagram">

        <div class="button-icon">
            📷
        </div>

        <span>
            Instagram
        </span>

    </a>

</div>

</div>

</body>

</html>
